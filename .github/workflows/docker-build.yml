name: Build onvif-virtual-camera

on:
  push:
    branches:
      - 'main'
      - 'dev'
      - 'grand-design'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          target: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/onvif-virtual-camera:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/onvif-virtual-camera:${{ github.ref_name }}-${{ github.sha }}
            ${{ github.ref_name == 'main' && format('ghcr.io/{0}/onvif-virtual-camera:latest', github.repository_owner) || '' }}
