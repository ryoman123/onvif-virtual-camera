name: Build onvif-virtual-camera

on:
  push:
    branches:
      - 'main'
      - 'dev'
      - 'grand-design'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          target: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/onvif-virtual-camera:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/onvif-virtual-camera:${{ github.ref_name }}-${{ github.sha }}
            ${{ github.ref_name == 'main' && format('ghcr.io/{0}/onvif-virtual-camera:latest', github.repository_owner) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}-${{ github.sha }}

      - name: Record immutable deployment image
        if: ${{ github.ref_name != 'dev' }}
        env:
          DEPLOYMENT_IMAGE: ghcr.io/${{ github.repository_owner }}/onvif-virtual-camera@${{ steps.build.outputs.digest }}
        run: |
          echo "Deployment image: ${DEPLOYMENT_IMAGE}"
          echo "### Immutable deployment image" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "\`${DEPLOYMENT_IMAGE}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Commit: \`${GITHUB_SHA}\`" >> "${GITHUB_STEP_SUMMARY}"
